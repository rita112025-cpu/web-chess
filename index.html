<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>簡單西洋棋</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <h1>♞ 簡單西洋棋</h1>

  <section class="game">
    <div class="bar" id="topBar"><span class="name" id="topName"></span><span class="caps" id="topCaps"></span></div>
    <div id="board" role="grid" aria-label="棋盤"></div>
    <div class="bar" id="botBar"><span class="name" id="botName"></span><span class="caps" id="botCaps"></span></div>
  </section>

  <aside class="side">
    <div class="card"><div id="status" aria-live="polite"></div></div>

    <div class="card controls">
      <div class="seg" role="group" aria-label="對戰模式">
        <button type="button" class="seg-btn" id="modeAi" data-mode="ai">對戰電腦</button>
        <button type="button" class="seg-btn" id="modePvp" data-mode="pvp">雙人同機</button>
      </div>
      <label id="sideRow">我執
        <select id="side">
          <option value="w">白棋（先手）</option>
          <option value="b">黑棋</option>
          <option value="random">隨機</option>
        </select>
      </label>
      <div class="btns">
        <button type="button" class="act primary" id="newBtn">新對局</button>
        <button type="button" class="act" id="undoBtn">悔棋</button>
        <button type="button" class="act" id="flipBtn">翻轉棋盤</button>
      </div>
    </div>

    <div class="card tips">
      <h2>怎麼玩？</h2>
      <ol>
        <li>點一下自己的棋子，棋盤會標出可以走的位置。</li>
        <li>圓點是移動，圓圈是可吃子；再點一下目標格就會走棋。</li>
        <li>國王被攻擊時會亮紅色（將軍），必須立刻化解。</li>
        <li>兵走到底線可以升變，會跳出視窗讓你選擇。</li>
      </ol>
    </div>
  </aside>
</main>

<div id="promo" role="dialog" aria-label="選擇升變棋子">
  <div class="box"><div>兵升變為：</div><div class="opts" id="promoOpts"></div></div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
